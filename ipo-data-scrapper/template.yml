AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model template describing your function.
Resources:
  IPODataScrapper:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: target/ipo-data-scrapper-1.0.SNAPSHOT.jar
      Description: ''
      MemorySize: 256
      Timeout: 15
      Handler: org.ipo.web.scrapper.WebScrapperService::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          CLOSE: https://www.investorgain.com/report/live-ipo-gmp/331/close/
          CURRENT: https://www.investorgain.com/report/live-ipo-gmp/331/current/
          LISTED: https://www.investorgain.com/report/live-ipo-gmp/331/listed/
          UPCOMING: https://www.investorgain.com/report/live-ipo-gmp/331/close/
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            - Sid: VisualEditor0
              Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:ListBackups
                - dynamodb:PurchaseReservedCapacityOfferings
                - logs:CreateLogGroup
                - dynamodb:ListStreams
                - dynamodb:ListContributorInsights
                - dynamodb:DescribeReservedCapacityOfferings
                - dynamodb:ListGlobalTables
                - dynamodb:DescribeReservedCapacity
                - dynamodb:ListImports
                - dynamodb:DescribeLimits
                - dynamodb:DescribeEndpoints
                - dynamodb:ListExports
              Resource: '*'
            - Sid: VisualEditor1
              Effect: Allow
              Action:
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:UpdateTimeToLive
                - dynamodb:UntagResource
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:*
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:DeleteTable
                - dynamodb:UpdateTableReplicaAutoScaling
                - logs:CreateLogGroup
                - logs:PutLogEvents
                - dynamodb:CreateTable
                - logs:CreateLogStream
                - dynamodb:TagResource
                - dynamodb:DescribeTable
                - dynamodb:GetItem
                - dynamodb:UpdateTable
              Resource:
                - arn:aws:dynamodb:*:*:table/*
                - arn:aws:logs:ap-south-1:114646606773:*
      SnapStart:
        ApplyOn: PublishedVersions
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
